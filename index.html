<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="伸榮産業株式会社｜お問い合わせ・事業所一覧">
  <title>伸榮産業株式会社｜お問い合わせ</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#242424;background:#f7f7f6;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;line-height:1.65}a{color:inherit}button,select{font:inherit}main{max-width:760px;margin:0 auto;padding:20px 18px 44px}
    .lang{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:16px;color:#666;font-size:13px}.lang select{border:1px solid #d5d5d5;border-radius:8px;padding:7px 28px 7px 10px;background:#fff;color:#222}
    .hero{text-align:center;background:#fff;border:1px solid #e9e7e5;border-radius:14px;padding:34px 22px 27px}.logo{display:block;width:100%;max-width:620px;height:auto;object-fit:contain;margin:0 auto}.hero .eyebrow{margin:20px 0 0;color:#666;font-size:13px;letter-spacing:.12em}.hero h1{font-size:22px;font-weight:700;letter-spacing:.05em;margin:4px 0 0}
    .section-heading{font-size:19px;margin:30px 2px 12px;border-left:4px solid #382820;padding-left:12px;line-height:1.5}.card{background:#fff;border:1px solid #e9e7e5;border-radius:13px;padding:22px 24px;margin:12px 0}.card h3{font-size:17px;margin:0 0 13px;font-weight:700}.muted{font-size:13px;color:#666}.contact-primary{font-size:clamp(24px,5vw,33px);font-weight:750;letter-spacing:.02em;text-decoration:none;color:#28211d;overflow-wrap:anywhere}.contact-primary:hover,.text-link:hover{text-decoration:underline}.contact-label{font-size:13px;color:#666;margin:0 0 2px}.detail{margin:12px 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.detail .key{color:#666;min-width:62px;font-size:13px}.text-link{color:#215787;overflow-wrap:anywhere;text-decoration:none}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:48px;border:1px solid #c9c6c3;border-radius:9px;background:#fff;color:#33261f;text-decoration:none;padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer}.btn.primary{background:#382820;border-color:#382820;color:#fff}.btn:hover{filter:brightness(.95)}.btn:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #a9774a;outline-offset:3px}.btn.wide{grid-column:1/-1}.address{margin:0 0 14px;white-space:pre-line}.phone-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.phone-row a{text-decoration:none;font-weight:700;color:#33261f}.phone-row a:hover{text-decoration:underline}.phone-row small{display:block;font-weight:400;color:#666}.footer{text-align:center;color:#888;font-size:12px;margin-top:34px}
    @media(max-width:480px){main{padding:12px 12px 35px}.hero{padding:27px 15px 22px}.hero h1{font-size:19px}.card{padding:19px 17px}.buttons{grid-template-columns:1fr}.btn.wide{grid-column:auto}.section-heading{margin-top:26px}.phone-row{gap:6px}}
  </style>
  <script src="data.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body><main>
  <div class="lang"><label for="language" id="language-label">言語</label><select id="language"><option value="ja">日本語</option><option value="en">English</option><option value="fr">Français</option></select></div>
  <header class="hero"><img class="logo" src="logo.png" alt="伸榮産業株式会社 ロゴ" width="755" height="104"><p id="subtitle" class="eyebrow">お問い合わせ・事業所案内</p></header>
  <h2 id="contact-heading" class="section-heading">お問い合わせ</h2>
  <section id="general" class="card" aria-labelledby="contact-heading"></section>
  <h2 id="locations-heading" class="section-heading">事業所一覧</h2>
  <div id="offices"></div>
  <p id="foot" class="footer">伸榮産業株式会社</p>
</main></body></html>
