<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="伸栄産業株式会社 — 連絡先・所在地">
<title>伸栄産業株式会社 | お問い合わせ</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#17253a;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:30px auto;padding:0 16px 36px}.hero{background:#173457;color:white;padding:30px 26px;border-radius:18px}.hero h1{font-size:clamp(22px,5vw,30px);margin:0 0 9px}.hero p{margin:0;color:#d8e5f2}.lang{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:14px}.lang label{font-size:13px}select{padding:9px;border:1px solid #c9d1dc;border-radius:9px;background:white;color:#152640}.office,.general{background:white;border:1px solid #e1e5eb;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 3px 14px #1a2b4810}.office h2,.general h2{margin:0 0 10px;font-size:19px}.address{line-height:1.65;margin:4px 0 12px}.details{color:#526276;font-size:14px;line-height:1.9;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid #ccd6e0;border-radius:10px;min-height:46px;text-decoration:none;color:#173457;background:white;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;text-align:center;padding:8px}.btn.primary{color:white;background:#1767a8;border-color:#1767a8}.btn:focus-visible,select:focus-visible{outline:3px solid #f0a937;outline-offset:2px}.wide{grid-column:1/-1}.footer{text-align:center;color:#667589;font-size:12px;margin:22px 0}a.inline{overflow-wrap:anywhere;color:#1767a8}@media(max-width:410px){.actions{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
<script src="data.js" defer></script>
<script src="site.js" defer></script>
</head>
<body><main>
<div class="lang"><label for="language" id="language-label">言語</label><select id="language" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="fr">Français</option></select></div>
<header class="hero"><h1 id="company-name">伸栄産業株式会社</h1><p id="subtitle">連絡先・所在地</p></header>
<div id="offices"></div><section id="general" class="general"></section>
<p class="footer" id="foot">お問い合わせ情報</p>
</main></body>
</html>
